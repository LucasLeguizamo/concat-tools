name: Release CLI

# Publica @lucasleguizamo/concat en npm con trusted publishing (OIDC): no hay NPM_TOKEN.
# Requisito único en npmjs.com: Settings > Trusted Publisher > GitHub Actions,
# con este repositorio y el archivo "release-cli.yml". Publicar requiere repo público
# (la provenance no se genera en repos privados) y que package.json tenga repository.url.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing no soporta self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC para npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 trae npm >= 11.5.1, mínimo para trusted publishing (Node 22 trae npm 10).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Verificar npm >= 11.5.1
        run: |
          npm -v
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm -v)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lucasleguizamo/concat typecheck
      - run: pnpm --filter @lucasleguizamo/concat lint
      - run: pnpm --filter @lucasleguizamo/concat test
      - run: pnpm --filter @lucasleguizamo/concat build
      - name: La versión coincide con el tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          [ "cli-v$v" = "$TAG" ] || { echo "El tag $TAG no coincide con la versión $v"; exit 1; }
      - name: Publicar
        working-directory: packages/cli
        run: npm publish --provenance --access public
